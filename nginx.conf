events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream springboot {
        server springboot:8080;
    }

    upstream python_email {
        server python-email:8000;
    }

    server {
        listen 80;
        server_name _;  # Tüm domainler için geçerli

        # HTTP'yi HTTPS'e yönlendir (SSL kurulduktan sonra)
        # return 301 https://$server_name$request_uri;

        # Geçici olarak HTTP'de çalışsın
        location / {
            proxy_pass http://springboot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/email/ {
            proxy_pass http://python_email/api/email/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # SSL Server (SSL sertifikası kurulduktan sonra aktif et)
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #
    #     location / {
    #         proxy_pass http://springboot;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #     }
    # }
}
