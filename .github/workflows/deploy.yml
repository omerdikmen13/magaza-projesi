name: Deploy to AWS EC2 (Full Stack)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build Spring Boot JAR
      run: mvn clean package -DskipTests
    
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
        chmod 600 ~/.ssh/ec2_key.pem
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy Spring Boot to EC2
      run: |
        scp -i ~/.ssh/ec2_key.pem \
          target/magaza-projesi-0.0.1-SNAPSHOT.jar \
          ubuntu@${{ secrets.EC2_HOST }}:~/app.jar
    
    - name: Restart Spring Boot on EC2
      run: |
        ssh -T -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          echo "=========================================="
          echo " Spring Boot Deploy"
          echo "=========================================="
          
          cd ~
          
          # Kill old Java process
          pkill -f "java -jar app.jar" || true
          sleep 2
          
          # Start with nohup
          nohup java -jar app.jar --server.port=8080 > springboot.log 2>&1 &
          
          # Wait and check
          sleep 10
          if pgrep -f "java -jar app.jar" > /dev/null; then
            echo "=========================================="
            echo " Spring Boot BASARILI (Port 8080)"
            echo " Email Microservice: http://16.16.197.152:8000"
            echo "=========================================="
          else
            echo "HATA: Spring Boot baslatilamadi!"
            tail -50 springboot.log
            exit 1
          fi
        EOF
    
    - name: Cleanup SSH Key
      if: always()
      run: rm -f ~/.ssh/ec2_key.pem
